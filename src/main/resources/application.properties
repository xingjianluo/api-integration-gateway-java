# ===== 对外服务端口 =====
# 0 = 随机端口（便于本地/测试多实例）；生产可固定。
server.port=0

# ===== 上游（本地模拟第三方）=====
# 基础地址；测试由 @LocalServerPort 注入。单机演示时留空即走相对地址。
gateway.upstream.base-url=
# 调用上游的读超时；超时归类为 UPSTREAM_TIMEOUT（临时、可重试）。
gateway.upstream.read-timeout=300ms

# ===== 重试（仅针对临时失败：超时/5xx/连接异常）=====
# 最大尝试次数（含首次）；404、缺字段、类型不匹配不重试。
gateway.retry.max-attempts=3
# 指数退避初始间隔与倍数：backoff * multiplier^(attempt-1)。
gateway.retry.backoff=20ms
gateway.retry.multiplier=2.0

# ===== 熔断器 =====
# 连续失败达到该阈值后熔断打开；打开期间快速失败并尝试降级。
gateway.circuit-breaker.failure-threshold=5
# 打开保持时长，过后进入半开，仅放一个试探请求。
gateway.circuit-breaker.open-duration=10s

# ===== 按客户端限流（固定窗口）=====
# 每个客户端在窗口内允许的最大请求数；超过返回 429 RATE_LIMITED。
gateway.rate-limit.permits-per-window=10
gateway.rate-limit.window=1m
