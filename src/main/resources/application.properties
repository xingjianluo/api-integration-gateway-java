server.port=0

# 日志：显式打印请求标识、命中的接口版本与判定依据（MDC 由 RequestIdFilter/Service 填充）
logging.pattern.console=%d{HH:mm:ss.SSS} %-5level [rid=%X{requestId:-},v=%X{apiVersion:-},basis=%X{versionBasis:-}] %logger{36} - %msg%n

# 上游（本地模拟）地址与超时
gateway.upstream.base-url=http://localhost:${server.port}/mock-upstream
gateway.upstream.connect-timeout=2s
gateway.upstream.read-timeout=1s
gateway.upstream.payments-path=/payments

# 版本兼容范围与默认版本
gateway.version.default-version=v1
gateway.version.supported[0]=v1
gateway.version.supported[1]=v2
gateway.version.supported[2]=v3

# 幂等：结果 TTL 与并发等待首请求的最长时间
gateway.idempotency.ttl=10m
gateway.idempotency.acquire-timeout=5s
gateway.idempotency.sweep-delay-ms=60000

# 限流：每客户端每个窗口的配额
gateway.rate-limit.permits-per-window=10
gateway.rate-limit.window=1m

# 临时失败退避重试
gateway.retry.max-attempts=3
gateway.retry.backoff=100ms
gateway.retry.multiplier=2
gateway.retry.max-backoff=1s

# 熔断：连续失败阈值与打开时长
gateway.circuit-breaker.failure-threshold=5
gateway.circuit-breaker.open-duration=10s

# 本地模拟上游
gateway.mock.supported-upstream-versions[0]=v1
gateway.mock.supported-upstream-versions[1]=v2
gateway.mock.supported-upstream-versions[2]=v3
gateway.mock.v2-latency=50ms
